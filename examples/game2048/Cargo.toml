[package]
name = "game2048"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# ArKan from parent. `parallel` is needed for `forward_batch_parallel`
# (src/train/gpu.rs) — it does not exist without the feature.
arkan = { path = "../..", features = ["gpu", "parallel"] }

# CLI and progress
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"

# Random
rand = "0.8"

# Parallelism
rayon = "1.10"
