[package]
name = "arkan"
version = "0.4.0"
edition = "2021"
# Determined empirically, not guessed: 1.72 fails on our own `div_ceil`
# (`int_roundings`, stable since 1.73) at src/config.rs:287; 1.73 builds the lib
# with default features and with `serde`. Optional features need more, because
# their dependencies do: `parallel` needs 1.80 (rayon-core), `gpu` needs 1.85
# (indexmap, via wgpu 23 -> naga). CI pins the default-feature MSRV; see
# .github/workflows/ci.yml and the MSRV table in README.md.
# ponytail: no Cargo.lock is committed (it is in .gitignore), so CI always
# resolves the newest compatible dependencies and this floor drifts upward on
# its own. The `msrv` job is what tells us it moved; the fix is to bump this line.
rust-version = "1.73"
description = "Embeddable Kolmogorov-Arnold Networks: SIMD B-spline inference, int8 quantized deployment, optional wgpu GPU backend"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LutwigStack/ArKan"
documentation = "https://docs.rs/arkan"
readme = "README.md"
keywords = ["kan", "ml", "simd", "spline", "inference"]
categories = ["algorithms", "science"]
exclude = ["target/*", "scripts/*", ".github/*", "README for KAN.md", "docs/audit/*", "docs/FUNCTIONALITY_AUDIT.md", "tasks/*"]

[dependencies]
# SIMD abstractions
wide = "0.7"
rand = { version = "0.8", features = ["small_rng"] }

# Parallelism (optional, `parallel` feature)
rayon = { version = "1.10", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }

# Error handling
thiserror = "1.0"

# GPU backend (optional)
wgpu = { version = "23.0", optional = true }
bytemuck = { version = "1.18", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand_distr = "0.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[features]
default = []
# Rayon-backed multi-core paths: `KanLayer::backward_parallel`,
# `KanNetwork::forward_batch_parallel`, and the automatic parallel branch of
# `train_step`'s backward pass above `KanConfig::multithreading_threshold`.
parallel = ["dep:rayon"]
serde = ["dep:serde", "dep:bincode"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "dep:log"]

[[bench]]
name = "forward"
harness = false

[[bench]]
name = "backward"
harness = false

[[bench]]
name = "scaling"
harness = false

[[bench]]
name = "spline_config"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "optimizer"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "baked"
harness = false

[[bench]]
name = "gpu_forward"
harness = false
required-features = ["gpu"]

[[bench]]
name = "gpu_backward"
harness = false
required-features = ["gpu"]

# game2048 is a separate project with its own Cargo.toml in examples/game2048/
